<?xml version="1.0" encoding="UTF-8"?>
<!-- H8 — Réseau d'écoulement sous un barrage-poids. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="h8-title h8-desc">
  <title id="h8-title">H8 — Réseau d'écoulement sous un barrage-poids</title>
  <desc id="h8-desc">Barrage-poids avec charge amont de dix mètres, couche perméable, couche imperméable, réseau d'écoulement et points A, B et C.</desc>
  <defs>
    <marker id="h8-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 5 L 10 0 L 10 10 Z" fill="#222"/>
    </marker>
    <pattern id="h8-concrete" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="2" fill="#777"/>
      <path d="M 14 4 l 5 4 l -4 5 z" fill="#999"/>
      <circle cx="10" cy="18" r="1.5" fill="#888"/>
    </pattern>
    <clipPath id="h8-permeable-clip">
      <rect x="55" y="160" width="690" height="190"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Noto Sans", "Noto Sans SC", Arial, sans-serif; font-size: 14px; fill: #222; }
    .outline { fill: none; stroke: #222; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .thin { fill: none; stroke: #555; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
    .water-fill { fill: #dceeff; }
    .waterline { fill: none; stroke: #4e91d8; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .flowline { fill: none; stroke: #444; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .equipotential { fill: none; stroke: #666; stroke-width: 1.1; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
    .dimension { fill: none; stroke: #222; stroke-width: 1.05; marker-start: url(#h8-arrow); marker-end: url(#h8-arrow); vector-effect: non-scaling-stroke; }
  </style>
  <!-- Couche perméable et substratum imperméable -->
  <rect x="55" y="160" width="690" height="190" fill="#faf8ef"/>
  <line class="outline" x1="55" y1="350" x2="745" y2="350"/>
  <g stroke="#777" stroke-width="1">
    <path d="M 65 350 l -9 12 M 85 350 l -9 12 M 105 350 l -9 12 M 125 350 l -9 12 M 145 350 l -9 12 M 165 350 l -9 12 M 185 350 l -9 12 M 205 350 l -9 12 M 225 350 l -9 12 M 245 350 l -9 12 M 265 350 l -9 12 M 285 350 l -9 12 M 305 350 l -9 12 M 325 350 l -9 12 M 345 350 l -9 12 M 365 350 l -9 12 M 385 350 l -9 12 M 405 350 l -9 12 M 425 350 l -9 12 M 445 350 l -9 12 M 465 350 l -9 12 M 485 350 l -9 12 M 505 350 l -9 12 M 525 350 l -9 12 M 545 350 l -9 12 M 565 350 l -9 12 M 585 350 l -9 12 M 605 350 l -9 12 M 625 350 l -9 12 M 645 350 l -9 12 M 665 350 l -9 12 M 685 350 l -9 12 M 705 350 l -9 12 M 725 350 l -9 12"/>
  </g>
  <!-- Eau amont et aval -->
  <rect class="water-fill" x="55" y="75" width="225" height="85" opacity="0.78"/>
  <line class="waterline" x1="55" y1="75" x2="280" y2="75"/>
  <line class="outline" x1="55" y1="160" x2="280" y2="160"/>
  <line class="waterline" x1="560" y1="160" x2="745" y2="160"/>
  <!-- Barrage en béton -->
  <path d="M 280 160 V 75 H 305 C 328 75 337 105 365 127 C 397 152 433 160 560 160 V 188 H 304 C 289 188 280 178 280 160 Z" fill="#d8d8d8" stroke="#222" stroke-width="2"/>
  <path d="M 280 160 V 75 H 305 C 328 75 337 105 365 127 C 397 152 433 160 560 160 V 188 H 304 C 289 188 280 178 280 160 Z" fill="url(#h8-concrete)" opacity="0.6"/>
  <!-- Réseau d'écoulement -->
  <g clip-path="url(#h8-permeable-clip)">
    <path class="flowline" d="M 280 160 C 286 201 350 213 560 188"/>
    <path class="flowline" d="M 250 160 C 245 248 380 285 590 160"/>
    <path class="flowline" d="M 210 160 C 185 310 430 351 630 160"/>
    <path class="flowline" d="M 160 160 C 112 344 500 402 685 160"/>
    <path class="equipotential" d="M 305 173 C 326 220 323 287 298 350"/>
    <path class="equipotential" d="M 350 182 C 369 230 369 299 350 350"/>
    <path class="equipotential" d="M 400 187 C 414 240 414 303 405 350"/>
    <path class="equipotential" d="M 450 187 C 460 240 461 303 462 350"/>
    <path class="equipotential" d="M 500 187 C 512 238 520 297 525 350"/>
    <path class="equipotential" d="M 548 185 C 570 230 589 287 594 350"/>
  </g>
  <!-- Niveaux d'eau -->
  <g class="waterline" transform="translate(155 75)">
    <path d="M -12 -18 H 12 L 0 -3 Z"/>
    <line x1="-15" y1="8" x2="15" y2="8" opacity="0.55"/>
    <line x1="-8" y1="14" x2="8" y2="14" opacity="0.35"/>
  </g>
  <g class="waterline" transform="translate(700 160)">
    <path d="M -12 -18 H 12 L 0 -3 Z"/>
    <line x1="-15" y1="8" x2="15" y2="8" opacity="0.55"/>
    <line x1="-8" y1="14" x2="8" y2="14" opacity="0.35"/>
  </g>
  <!-- Charge, points et libellés -->
  <line class="dimension" x1="105" y1="79" x2="105" y2="156"/>
  <text x="92" y="122" font-size="17" text-anchor="end">10 m</text>
  <text x="68" y="230" font-size="17">Permeable</text>
  <text x="68" y="251" font-size="17">layer</text>
  <text x="400" y="381" font-size="17" text-anchor="middle">Impermeable layer</text>
  <circle cx="310" cy="269" r="3.2" fill="#222"/><text x="320" y="266" font-size="17">A</text>
  <circle cx="405" cy="202" r="3.2" fill="#222"/><text x="415" y="199" font-size="17">B</text>
  <circle cx="296" cy="340" r="3.2" fill="#222"/><text x="306" y="337" font-size="17">C</text>
  <!-- Barre d'échelle -->
  <line class="outline" x1="360" y1="408" x2="450" y2="408"/>
  <line class="outline" x1="360" y1="402" x2="360" y2="414"/>
  <line class="outline" x1="450" y1="402" x2="450" y2="414"/>
  <text x="405" y="400" font-size="16" text-anchor="middle">10 m</text>
</svg>
