<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="soil-title soil-desc" style="font-family:'Noto Sans','Noto Sans SC','Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#222">
  <title id="soil-title">Coupe du profil de sol à échelle verticale proportionnelle</title>
  <desc id="soil-desc">Profil de sol entre zéro et quatorze mètres. Les coordonnées verticales sont proportionnelles à la profondeur.</desc>
  <rect width="760" height="560" fill="#f9f9f9"/>

  <!-- Échelle verticale : y = 60 + 30d, avec d en mètres. -->
  <g stroke="currentColor" stroke-width="1.3" fill="none">
    <line x1="115" y1="60" x2="115" y2="480"/>
    <line x1="108" y1="60" x2="122" y2="60"/>
    <line x1="108" y1="120" x2="122" y2="120"/>
    <line x1="108" y1="180" x2="122" y2="180"/>
    <line x1="108" y1="480" x2="122" y2="480"/>
  </g>

  <g fill="currentColor" font-size="17" text-anchor="end">
    <text x="100" y="66">0 m</text>
    <text x="100" y="126">2 m</text>
    <text x="100" y="186">4 m</text>
    <text x="100" y="486">14 m</text>
  </g>

  <text x="35" y="270" fill="currentColor" font-size="15" text-anchor="middle" transform="rotate(-90 35 270)">Profondeur (m)</text>

  <line x1="140" y1="60" x2="700" y2="60" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="50" fill="currentColor" font-size="16">T.N.</text>

  <line x1="140" y1="120" x2="700" y2="120" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M153 92 L177 92 L165 114 Z"/>
    <line x1="154" y1="120" x2="176" y2="120"/>
  </g>

  <line x1="140" y1="180" x2="700" y2="180" stroke="currentColor" stroke-width="1.5"/>
  <line x1="140" y1="480" x2="700" y2="480" stroke="currentColor" stroke-width="1.5"/>

  <g fill="currentColor" font-size="18" text-anchor="middle">
    <text x="420" y="98">Sable fin saturé par capillarité</text>
    <text x="420" y="158">Sable fin</text>
    <text x="420" y="338">Limon</text>
    <text x="420" y="528" font-style="italic">Substratum</text>
  </g>
</svg>
