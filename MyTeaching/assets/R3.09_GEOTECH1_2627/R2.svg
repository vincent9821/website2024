<?xml version="1.0" encoding="UTF-8"?>
<!-- R2 — Schéma isométrique du bâtiment. Dimensions en mètres. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="r2-title r2-desc">
  <title id="r2-title">R2 — Bibliothèque et tour de stockage</title>
  <desc id="r2-desc">Bâtiment bas de quarante mètres par dix mètres, divisé en deux longueurs de vingt mètres, avec une tour de stockage de dix mètres par dix mètres et le point O.</desc>
  <defs>
    <marker id="r2-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 5 L 10 0 L 10 10 Z" fill="#222"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans", "Noto Sans SC", Arial, sans-serif; font-size: 14px; fill: #222; }
    .edge { fill: none; stroke: #666; stroke-width: 1.3; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .dimension { fill: none; stroke: #222; stroke-width: 1.05; marker-start: url(#r2-arrow); marker-end: url(#r2-arrow); vector-effect: non-scaling-stroke; }
    .extension { fill: none; stroke: #666; stroke-width: 1; vector-effect: non-scaling-stroke; }
  </style>
  <!-- Bâtiment bas : volume 40 m × 10 m -->
  <polygon points="120,335 520,335 600,270 200,270" fill="#cfcfcf"/>
  <polygon points="120,335 520,335 520,405 120,405" fill="#b6b6b6"/>
  <polygon points="520,335 600,270 600,340 520,405" fill="#9e9e9e"/>
  <path class="edge" d="M 120 335 L 520 335 L 600 270 L 200 270 Z M 120 335 V 405 H 520 V 335 M 520 405 L 600 340 V 270"/>
  <!-- Tour de stockage : emprise 10 m × 10 m -->
  <polygon points="205,145 305,145 375,88 275,88" fill="#d8d8d8"/>
  <polygon points="205,145 305,145 305,335 205,335" fill="#a9a9a9"/>
  <polygon points="305,145 375,88 375,278 305,335" fill="#8f8f8f"/>
  <path class="edge" d="M 205 145 L 305 145 L 375 88 L 275 88 Z M 205 145 V 335 H 305 V 145 M 305 335 L 375 278 V 88"/>
  <text x="255" y="230" font-size="18" text-anchor="middle">Tour de</text>
  <text x="255" y="252" font-size="18" text-anchor="middle">stockage</text>
  <text x="365" y="300" font-size="18" text-anchor="middle" transform="rotate(-9 365 300)">Salles de lecture</text>
  <!-- Point O -->
  <circle cx="330" cy="350" r="4" fill="#222"/>
  <text x="342" y="365" font-size="20">O</text>
  <!-- Dimensions longitudinales 20 m + 20 m -->
  <line class="extension" x1="120" y1="405" x2="120" y2="445"/>
  <line class="extension" x1="320" y1="405" x2="320" y2="445"/>
  <line class="extension" x1="520" y1="405" x2="520" y2="445"/>
  <line class="dimension" x1="124" y1="438" x2="316" y2="438"/>
  <line class="dimension" x1="324" y1="438" x2="516" y2="438"/>
  <text x="220" y="463" font-size="17" text-anchor="middle">20 m</text>
  <text x="420" y="463" font-size="17" text-anchor="middle">20 m</text>
  <!-- Largeur 10 m du bâtiment bas -->
  <line class="extension" x1="520" y1="405" x2="545" y2="425"/>
  <line class="extension" x1="600" y1="340" x2="625" y2="360"/>
  <line class="dimension" x1="548" y1="420" x2="622" y2="360"/>
  <text x="628" y="398" font-size="17">10 m</text>
  <!-- Emprise 10 m × 10 m de la tour -->
  <line class="extension" x1="205" y1="145" x2="205" y2="122"/>
  <line class="extension" x1="305" y1="145" x2="305" y2="122"/>
  <line class="dimension" x1="209" y1="117" x2="301" y2="117"/>
  <text x="255" y="108" font-size="17" text-anchor="middle">10 m</text>
  <line class="extension" x1="205" y1="145" x2="185" y2="132"/>
  <line class="extension" x1="275" y1="88" x2="255" y2="75"/>
  <line class="dimension" x1="187" y1="126" x2="257" y2="69"/>
  <text x="205" y="73" font-size="17" text-anchor="middle">10 m</text>
</svg>
